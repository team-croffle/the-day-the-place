[project]
name = "collector"
version = "0.1.0"
description = "「그 날, 그 곳」 특별전 수집기 (네이버 뉴스 검색 + Gemini)"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "google-genai>=2.21.0",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.3.5",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "tenacity>=9.1.4",
]

[project.scripts]
collector = "collector.__main__:main"

[dependency-groups]
dev = ["modal>=1.5.5", "mypy>=2.3.1", "pytest>=9.1.1", "ruff>=0.16.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

# ---------------------------------------------------------------- ruff (lint)
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
  "F",     # pyflakes
  "E",     # pycodestyle error
  "W",     # pycodestyle warning
  "I",     # isort
  "N",     # pep8-naming
  "UP",    # pyupgrade
  "B",     # bugbear
  "A",     # builtins shadowing
  "C4",    # comprehensions
  "DTZ",   # naive datetime 금지 (전시 기간 계산에서 중요)
  "T20",   # print 금지 (logging 사용)
  "SIM",   # simplify
  "TID",   # tidy imports
  "PTH",   # pathlib
  "ASYNC", # async 안티패턴
  "S",     # bandit
  "ARG",   # 미사용 인자
  "ERA",   # 주석 처리된 코드
  "PL",    # pylint
  "RUF",
]
ignore = [
  "PLR0913", # 인자 개수 제한은 과함
  "S105",    # 하드코딩 비밀번호 오탐
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ARG"]
"modal_app.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["collector"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# -------------------------------------------------------------- ruff (format)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

# ---------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
files = ["src", "tests", "modal_app.py"]

[[tool.mypy.overrides]]
module = ["modal.*"]
ignore_missing_imports = true
disallow_untyped_decorators = false

# -------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

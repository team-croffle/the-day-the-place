[project]
name = "collector"
version = "0.3.0"
description = "그 날, 그 곳 특별전 수집기"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "google-genai>=1.41.0",
  "httpx>=0.28.1",
  "modal>=1.1.0",
  "pydantic-settings>=2.11.0",
  "selectolax>=0.3.34",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pytest>=8.4.2",
  "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["collector"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "google.*", "google.genai.*", "modal.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

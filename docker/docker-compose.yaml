name: nest-vue

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nest_vue}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nest_vue}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nest-vue]

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    image: nest-vue-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Asia/Seoul}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nest_vue}
    ports:
      - '${SERVER_PORT:-3000}:3000'
    networks: [nest-vue]

volumes:
  postgres-data:

networks:
  nest-vue:
    driver: bridge
